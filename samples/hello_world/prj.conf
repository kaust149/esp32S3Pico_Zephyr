# PicoCalc on ESP32-S3-Pico: display (SPI) + southbridge keyboard (I2C).
# No UI toolkit or shell; the application draws to the display itself.

CONFIG_DISPLAY=y
CONFIG_ILI9341=y
CONFIG_SPI=y

CONFIG_GPIO=y
CONFIG_PWM=y

CONFIG_I2C=y
CONFIG_I2C_INIT_PRIORITY=50

# Epsilon (NumWorks) reserves a 32 KiB stack: raise to 32768 when porting it.
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=n
# CONFIG_LOG_DEFAULT_LEVEL=4
# CONFIG_DISPLAY_LOG_LEVEL_DBG=y
# CONFIG_SPI_LOG_LEVEL_DBG=y

# UART console for debug output (printk / printf)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
